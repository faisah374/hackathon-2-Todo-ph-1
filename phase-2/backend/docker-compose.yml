version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./todo_backend.db
      - BETTER_AUTH_SECRET=dev_secret_key_for_local_development_only
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    env_file:
      - .env
    volumes:
      - .:/app  # Mount current directory for development
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000  # Enable reload for development

volumes:
  postgres_data: